<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Stukdee的精神小屋 - 一个爱做小游戏、画画、研究古籍的猫咪爱好者" />
  <title>Stukdee的精神小屋</title>
  <link rel="icon" type="image/svg+xml" href="icon/logo.svg" />
  <link rel="apple-touch-icon" href="icon/head.PNG" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <img src="icon/logo.svg" alt="logo" class="brand-logo" />
      <span class="brand-title">Stukdee的精神小屋</span>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
      <span class="theme-icon-light">☀️</span>
      <span class="theme-icon-dark">🌙</span>
    </button>
  </header>

  <!-- 主舞台：3D 卡片轮播 -->
  <main class="stage">
    <div id="carousel" class="carousel">
      <div id="ring" class="ring"></div>
    </div>

    <!-- 滚动提示 -->
    <div class="scroll-hint" id="scrollHint">
      <span>滚 / 滑 动 来翻转卡片</span>
      <div class="hint-arrow">↕</div>
    </div>

    <!-- 进度指示 -->
    <div class="progress" id="progress"></div>
  </main>

  <footer class="footer">
    <span>© Stukdee · 用 ✨ 和 🐱 拼装而成</span>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
