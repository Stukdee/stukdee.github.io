<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stukdee的精神小屋 ✿</title>
  <link rel="icon" type="image/svg+xml" href="icon/logo.svg" />

  <style>
    /* ========== Font Face ========== */
    @font-face {
      font-family: "Arial Unicode";
      src: url("fonts/Arial Unicode.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ========== CSS Variables – 粉红色主题 ========== */
    :root {
      --font-main: "Arial Unicode", "PingFang SC", "Microsoft YaHei", sans-serif;

      /* 浅色模式 — 粉白奶霜 */
      --bg-primary: #fff6f9;
      --bg-secondary: #ffeaf2;
      --bg-card: #ffffff;
      --bg-hover: #ffd9e6;
      --text-primary: #3d1f2b;
      --text-secondary: #7a4a5a;
      --text-muted: #b08a96;
      --pink-main: #ff6b8a;
      --pink-light: #ff8fab;
      --pink-lighter: #ffd9e3;
      --pink-glow: rgba(255, 107, 138, 0.2);
      --border-color: #f5d0dc;
      --shadow-soft: 0 4px 24px rgba(255, 107, 138, 0.12);
      --shadow-hover: 0 8px 36px rgba(255, 107, 138, 0.22);
      --gradient-warm: linear-gradient(135deg, #ffe4ed, #ffb8cb);
      --gradient-hero: linear-gradient(180deg, #fff6f9 0%, #ffeaf2 100%);
    }

    [data-theme="dark"] {
      --bg-primary: #1f1520;
      --bg-secondary: #2d1e2a;
      --bg-card: #382a34;
      --bg-hover: #4a3645;
      --text-primary: #f5e3e8;
      --text-secondary: #cdb1bc;
      --text-muted: #957a86;
      --pink-main: #ff7a96;
      --pink-light: #ff99b0;
      --pink-lighter: #5a3a4a;
      --pink-glow: rgba(255, 107, 138, 0.18);
      --border-color: #4a3545;
      --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 8px 36px rgba(0, 0, 0, 0.5);
      --gradient-warm: linear-gradient(135deg, #4a3545, #5a3a4a);
      --gradient-hero: linear-gradient(180deg, #1f1520 0%, #2d1e2a 100%);
    }

    /* ========== Reset & Base ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      transition: background-color 0.4s, color 0.4s;
      overflow-x: hidden;
    }
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========== Floating Decor ========== */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 22px;
      opacity: 0.25;
      animation: floatUp 10s ease-in-out infinite;
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-28px) rotate(8deg); opacity: 0.4; }
    }
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatFadeOut {
      0% { opacity: 0; transform: translateY(10px) scale(0.9); }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 1; transform: translateY(-4px) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.95); }
    }

    /* ========== Navbar ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(18px);
      background-color: color-mix(in srgb, var(--bg-primary) 78%, transparent);
      border-bottom: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .nav-logo img {
      width: 40px;
      height: 40px;
      transition: transform 0.3s;
    }
    .nav-logo:hover img {
      animation: wiggle 0.5s ease-in-out;
    }
    .nav-logo span {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-primary);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-secondary);
      font-size: 15px;
      position: relative;
      padding: 4px 0;
      transition: color 0.3s;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--pink-main);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .nav-links a:hover {
      color: var(--pink-main);
    }
    .nav-links a:hover::after {
      width: 100%;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-toggle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.08);
      border-color: var(--pink-main);
      box-shadow: var(--shadow-soft);
    }
    .hamburger {
      display: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .mobile-menu {
      display: none;
      position: fixed;
      top: 73px;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 20px;
      z-index: 199;
      transform: translateY(-120%);
      transition: transform 0.3s;
    }
    .mobile-menu.open {
      transform: translateY(0);
    }
    .mobile-menu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .mobile-menu a {
      color: var(--text-primary);
      font-size: 18px;
      padding: 8px 0;
      display: block;
    }

    /* ========== Hero ========== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 32px 60px;
      position: relative;
      background: var(--gradient-hero);
      overflow: hidden;
      z-index: 1;
    }
    .hero-paw {
      position: absolute;
      font-size: 56px;
      opacity: 0.08;
      pointer-events: none;
    }
    .hero-paw.p1 { top: 12%; left: 6%; transform: rotate(-15deg); }
    .hero-paw.p2 { top: 55%; left: 4%; transform: rotate(20deg); font-size: 72px; }
    .hero-paw.p3 { top: 22%; right: 8%; transform: rotate(15deg); font-size: 64px; }
    .hero-paw.p4 { bottom: 18%; right: 6%; transform: rotate(-20deg); }

    .hero-content {
      max-width: 860px;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: slideInUp 1s ease-out;
    }
    .hero-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 28px;
    }
    .hero-avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid var(--bg-card);
      box-shadow: var(--shadow-hover);
      object-fit: cover;
      transition: transform 0.5s ease;
      cursor: pointer;
      background: var(--bg-card);
    }
    .hero-avatar:hover {
      transform: scale(1.08) rotate(-4deg);
    }
    .hero-avatar-ring {
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border: 2px dashed var(--pink-light);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero-emoji-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      font-size: 28px;
    }
    .hero-emoji-row span {
      display: inline-block;
      animation: bounce-slow 2.4s ease-in-out infinite;
    }
    .hero-emoji-row span:nth-child(2) { animation-delay: 0.2s; }
    .hero-emoji-row span:nth-child(3) { animation-delay: 0.4s; }
    .hero-emoji-row span:nth-child(4) { animation-delay: 0.6s; }
    .hero-emoji-row span:nth-child(5) { animation-delay: 0.8s; }

    .hero-title {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .hero-title .highlight {
      background: linear-gradient(135deg, var(--pink-main), var(--pink-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: clamp(16px, 2.4vw, 22px);
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.8;
    }
    .hero-tagline {
      font-size: clamp(14px, 2vw, 18px);
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 34px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      font-family: var(--font-main);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--pink-main), var(--pink-light));
      color: white;
      box-shadow: 0 4px 18px var(--pink-glow);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px var(--pink-glow);
    }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
    }
    .btn-secondary:hover {
      border-color: var(--pink-main);
      color: var(--pink-main);
      transform: translateY(-3px);
    }
    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      animation: bounce-slow 2s ease-in-out infinite;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* ========== Section Common ========== */
    section {
      padding: 80px 32px;
      position: relative;
      z-index: 1;
    }
    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .section-eyebrow {
      display: inline-block;
      padding: 6px 20px;
      background: var(--bg-secondary);
      color: var(--pink-main);
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: bold;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .section-subtitle {
      color: var(--text-secondary);
      font-size: clamp(14px, 1.8vw, 18px);
      max-width: 600px;
      margin: 0 auto;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ========== About ========== */
    .about-section {
      background: var(--bg-primary);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 60px;
      align-items: center;
    }
    .about-illustration {
      background: var(--gradient-warm);
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }
    /* 替换 big-cat 为头像样式 */
    .big-cat {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: inline-block;
      margin-bottom: 12px;
      border: 3px solid var(--bg-card);
      box-shadow: var(--shadow-soft);
    }
    .about-illustration h3 {
      font-size: 22px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .about-illustration p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .floating-sticker {
      position: absolute;
      background: var(--bg-card);
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 13px;
      box-shadow: var(--shadow-soft);
      animation: bounce-slow 3s ease-in-out infinite;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .sticker-1 { top: 16px; right: -16px; animation-delay: 0s; }
    .sticker-2 { bottom: 36px; left: -24px; animation-delay: 1s; }
    .sticker-3 { top: 50%; right: -36px; animation-delay: 0.6s; }

    .about-content h3 {
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .about-content p {
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.9;
    }
    .about-names {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }
    .name-tag {
      padding: 6px 18px;
      background: var(--bg-secondary);
      border-radius: 50px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
      cursor: default;
    }
    .name-tag:hover {
      background: var(--pink-main);
      color: white;
      transform: translateY(-2px);
    }
    .name-tag .label {
      color: var(--text-muted);
      font-size: 12px;
      margin-right: 4px;
    }
    .name-tag:hover .label {
      color: rgba(255,255,255,0.8);
    }
    .favorites-list {
      list-style: none;
      margin-top: 18px;
    }
    .favorites-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-color);
      color: var(--text-secondary);
    }
    .favorites-list li:last-child {
      border-bottom: none;
    }
    .fav-icon {
      font-size: 24px;
      width: 36px;
      text-align: center;
    }

    /* ========== Hobbies ========== */
    .hobbies-section {
      background: var(--bg-secondary);
    }
    .hobbies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }
    .hobby-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }
    .hobby-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--pink-main), var(--pink-light));
      transform: scaleX(0);
      transition: transform 0.3s;
    }
    .hobby-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }
    .hobby-card:hover::before {
      transform: scaleX(1);
    }
    .hobby-icon {
      font-size: 52px;
      margin-bottom: 14px;
      display: inline-block;
      transition: transform 0.4s;
    }
    .hobby-card:hover .hobby-icon {
      transform: scale(1.18) rotate(6deg);
    }
    .hobby-card h3 {
      font-size: 20px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .hobby-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .hobby-card.seeking {
      border: 2px dashed var(--border-color);
      background: transparent;
    }
    .hobby-card.seeking:hover {
      border-color: var(--pink-light);
    }
    .hobby-card .sparkle {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .hobby-card:hover .sparkle {
      opacity: 1;
      animation: sparkle 1s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }

    /* ========== Social ========== */
    .social-section {
      background: var(--bg-primary);
    }
    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      max-width: 900px;
      margin: 0 auto;
    }
    .social-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .social-card::after {
      content: '↗';
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 16px;
      color: var(--text-muted);
      opacity: 0;
      transition: all 0.3s;
    }
    .social-card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: var(--shadow-hover);
    }
    .social-card:hover::after {
      opacity: 1;
      transform: translate(3px, -3px);
    }
    .social-card img {
      width: 44px;
      height: 44px;
      transition: transform 0.3s;
      filter: none;
    }
    [data-theme="dark"] .social-card img {
      filter: brightness(1.15);
    }
    .social-card:hover img {
      transform: scale(1.12);
    }
    .social-card span {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 500;
    }
    .social-card .handle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ========== Fun ========== */
    .fun-section {
      background: var(--bg-secondary);
    }
    .fun-container {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }
    .click-counter-box {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cat-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: var(--gradient-warm);
      font-size: 0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 24px var(--pink-glow);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cat-button .cat-emoji {
      font-size: 60px;
      line-height: 1;
      transition: transform 0.2s;
    }
    .cat-button:hover {
      transform: scale(1.08);
    }
    .cat-button:hover .cat-emoji {
      transform: scale(0.92);
    }
    .cat-button:active {
      transform: scale(0.94);
    }
    .click-count {
      font-size: 34px;
      font-weight: 800;
      color: var(--pink-main);
      margin-bottom: 4px;
    }
    .click-label {
      color: var(--text-muted);
      font-size: 14px;
    }
    .mood-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .mood-btn {
      padding: 6px 14px;
      border-radius: 50px;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      font-family: var(--font-main);
    }
    .mood-btn:hover,
    .mood-btn.active {
      border-color: var(--pink-main);
      background: var(--pink-main);
      color: white;
    }

    /* ========== Floating Message ========== */
    .floating-msg {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 8px 20px;
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      font-size: 14px;
      max-width: 200px;
      text-align: center;
      animation: floatFadeOut 2.2s ease-out forwards;
    }

    /* ========== Custom Modal ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-box {
      background: var(--bg-card);
      border-radius: 32px;
      padding: 32px 28px 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;

    // ===== Modal Provider =====
    function ModalProvider({ children }) {
      const [modalState, setModalState] = useState({
        open: false,
        type: 'alert',
        message: '',
        resolve: null,
        reject: null,
      });

      const showAlert = useCallback((message) => {
        return new Promise((resolve) => {
          setModalState({
            open: true,
            type: 'alert',
            message: message,
            resolve: resolve,
            reject: null,
          });
        });
      }, []);

      const showConfirm = useCallback((message) => {
        return new Promise((resolve) => {
          setModalState({
            open: true,
            type: 'confirm',
            message: message,
            resolve: resolve,
            reject: null,
          });
        });
      }, []);

      const closeModal = useCallback(() => {
        setModalState(prev => {
          if (prev.resolve) {
            if (prev.type === 'confirm') {
              prev.resolve(false);
            } else {
              prev.resolve();
            }
          }
          return {
            open: false,
            type: 'alert',
            message: '',
            resolve: null,
            reject: null,
          };
        });
      }, []);

      const handleConfirm = useCallback(() => {
        setModalState(prev => {
          if (prev.resolve) {
            if (prev.type === 'confirm') {
              prev.resolve(true);
            } else {
              prev.resolve();
            }
          }
          return {
            open: false,
            type: 'alert',
            message: '',
            resolve: null,
            reject: null,
          };
        });
      }, []);

      const handleCancel = useCallback(() => {
        setModalState(prev => {
          if (prev.resolve && prev.type === 'confirm') {
            prev.resolve(false);
          }
          return {
            open: false,
            type: 'alert',
            message: '',
            resolve: null,
            reject: null,
          };
        });
      }, []);

      const value = { showAlert, showConfirm };

      return (
        <ModalContext.Provider value={value}>
          {children}
          <CustomModal
            open={modalState.open}
            type={modalState.type}
            message={modalState.message}
            onConfirm={handleConfirm}
            onCancel={handleCancel}
            onClose={closeModal}
          />
        </ModalContext.Provider>
      );
    }

    // ===== 流星 Canvas 组件（覆盖整个上边缘和左边缘） =====
    function ShootingStars({ isDark }) {
      const canvasRef = useRef(null);
      const animationRef = useRef(null);
      const starsRef = useRef([]);

      useEffect(() => {
        if (!isDark) {
          const canvas = canvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
            animationRef.current = null;
          }
          return;
        }

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const resize = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w;
          canvas.height = h;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
        };
        window.addEventListener('resize', resize);
        resize();

        const STAR_COUNT = 12;
        const BASE_ANGLE = Math.PI / 4; // 45度
        const ANGLE_VARY = 0.08;
        const SPEED_MIN = 5;
        const SPEED_MAX = 9;

        function createStar(w, h) {
          // 随机选择从顶部或左侧进入
          const fromTop = Math.random() > 0.5;
          let x, y;
          if (fromTop) {
            x = Math.random() * w;
            y = -5; // 顶部外
          } else {
            x = -5;
            y = Math.random() * h;
          }
          const angle = BASE_ANGLE + (Math.random() - 0.5) * ANGLE_VARY;
          const speed = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const length = 80 + Math.random() * 120;
          const opacity = 0.5 + Math.random() * 0.5;
          return { x, y, vx, vy, length, opacity };
        }

        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push(createStar(canvas.width, canvas.height));
        }
        starsRef.current = stars;

        let lastTime = 0;
        const frameRate = 1000 / 60;

        function animate(time) {
          if (!isDark) return;
          if (time - lastTime < frameRate) {
            animationRef.current = requestAnimationFrame(animate);
            return;
          }
          lastTime = time;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          stars.forEach(star => {
            star.x += star.vx;
            star.y += star.vy;

            // 如果完全离开屏幕（右下或超出），重置到顶部或左侧
            if (star.x > canvas.width + 100 || star.y > canvas.height + 100) {
              const fromTop = Math.random() > 0.5;
              if (fromTop) {
                star.x = Math.random() * canvas.width;
                star.y = -5;
              } else {
                star.x = -5;
                star.y = Math.random() * canvas.height;
              }
              const angle = BASE_ANGLE + (Math.random() - 0.5) * ANGLE_VARY;
              const speed = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
              star.vx = Math.cos(angle) * speed;
              star.vy = Math.sin(angle) * speed;
              star.length = 80 + Math.random() * 120;
              star.opacity = 0.5 + Math.random() * 0.5;
            }

            drawStar(ctx, star);
          });

          animationRef.current = requestAnimationFrame(animate);
        }

        function drawStar(ctx, star) {
          const { x, y, vx, vy, length, opacity } = star;
          const angle = Math.atan2(vy, vx);
          const tailX = x - Math.cos(angle) * length;
          const tailY = y - Math.sin(angle) * length;

          const grad = ctx.createLinearGradient(x, y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 255, 255, ${opacity})`);
          grad.addColorStop(0.4, `rgba(255, 220, 230, ${opacity * 0.7})`);
          grad.addColorStop(1, `rgba(255, 200, 210, 0)`);

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(tailX, tailY);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5 + Math.random() * 1.5;
          ctx.lineCap = 'round';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.9})`;
          ctx.fill();

          ctx.shadowColor = 'rgba(255, 200, 220, 0.3)';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 200, 220, ${opacity * 0.2})`;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        animationRef.current = requestAnimationFrame(animate);

        return () => {
          window.removeEventListener('resize', resize);
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
            animationRef.current = null;
          }
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
      }, [isDark]);

      return <canvas ref={canvasRef} className="shooting-stars-canvas" />;
    }

    function Hobbies() {

    // ===== Social =====
    function Social() {
      const { showConfirm, showAlert } = useModal();

      const handleSocialClick = async (e, link) => {
        e.preventDefault();
        if (link.name === '抖音') {
          const confirmResult = await showConfirm(`是否复制抖音号：${link.handle} ？`);
          if (confirmResult) {
            try {
              await navigator.clipboard.writeText(link.handle);
              await showAlert('✅ 已复制抖音号到剪贴板！');
            } catch {
              const textArea = document.createElement('textarea');
              textArea.value = link.handle;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand('copy');
              document.body.removeChild(textArea);
              await showAlert('✅ 已复制抖音号到剪贴板！');
            }
          }
        } else {
          const confirmResult = await showConfirm(`即将跳转到 ${link.name}，是否继续？`);
          if (confirmResult) {
            window.open(link.url, '_blank');
          }
        }
      };

      return (
        <section className="social-section" id="social">
          <div className="container">
            <div className="section-header reveal">
              <span className="section-eyebrow">🔗 Links</span>
              <h2 className="section-title">找到我呀</h2>
              <p className="section-subtitle">在这些地方也能找到我，一起来玩吧～ (◍•ᴗ•◍)</p>
            </div>
            <div className="social-grid">
              {socialLinks.map((s, i) => (
                <div
                  key={i}
                  className="social-card reveal"
                  style={{ transitionDelay: `${i * 0.05}s` }}
                  onClick={(e) => handleSocialClick(e, s)}
                >
                  <img src={s.icon} alt={s.name} />
                  <span>{s.name}</span>
                  <span className="handle">{s.handle}</span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ===== Fun Section =====
    function FunSection() {
      const [clicks, setClicks] = useState(() => {
        const saved = localStorage.getItem("stukdee_cat_clicks");
        return saved ? parseInt(saved, 10) : 0;
      });
      const [mood, setMood] = useState(moods[0].emoji);
      const [messages, setMessages] = useState([]);

      useEffect(() => {
        localStorage.setItem("stukdee_cat_clicks", clicks.toString());
      }, [clicks]);

      const handleClick = () => {
        const newCount = clicks + 1;
        setClicks(newCount);

        const randomMsg = catMessages[Math.floor(Math.random() * catMessages.length)];

        const bubbleWidth = 180;
        const bubbleHeight = 50;
        const pad = 20;
        const x = Math.random() * (window.innerWidth - bubbleWidth - pad * 2) + pad;
        const y = Math.random() * (window.innerHeight - bubbleHeight - pad * 2) + pad;

        const id = Date.now() + Math.random();
        setMessages(prev => [...prev, { id, text: randomMsg, x, y }]);

        setTimeout(() => {
          setMessages(prev => prev.filter(m => m.id !== id));
        }, 2400);
      };

      return (
        <section className="fun-section" id="fun">
          <div className="container">
            <div className="section-header reveal">
              <span className="section-eyebrow">🎮 Playground</span>
              <h2 className="section-title">互动小屋</h2>
              <p className="section-subtitle">来和小猫咪互动吧～ 点一点，选个心情 ♡</p>
            </div>
            <div className="fun-container reveal">
              <div className="click-counter-box">
                <button className="cat-button" onClick={handleClick} aria-label="撸猫">
                  <span className="cat-emoji">{mood}</span>
                </button>
                <div className="click-count">{clicks}</div>
                <div className="click-label">次撸猫 ♡</div>
                <div className="mood-row">
                  {moods.map(m => (
                    <button key={m.emoji} className={`mood-btn ${mood === m.emoji ? "active" : ""}`} onClick={() => setMood(m.emoji)}>
                      {m.emoji} {m.label}
                    </button>
                  ))}
                </div>
              </div>
              <p style={{ color: "var(--text-muted)", fontSize: "14px" }}>（数据保存在浏览器里，刷新也不丢～）</p>
            </div>
          </div>

          {messages.map(msg => (
            <div key={msg.id} className="floating-msg" style={{ left: msg.x, top: msg.y }}>
              {msg.text}
            </div>
          ))}
        </section>
      );
    }

    // ===== Footer =====
    function Footer() {
      const kaomojis = ["( ´ ▽ ` )ﾉ", "(๑•̀ㅂ•́)و✧", "=^･ω･^=", "(◍•ᴗ•◍)", "( づ ωど)", "＼(^o^)／"];
      const [idx, setIdx] = useState(0);

        return () => clearInterval(t);

      return (
        <footer>
          <p>🐱 Stukdee的精神小屋 · 用爱制作 ♡</p>
          <p>© 2026 Stukdee. All rights reserved.</p>
          <div className="footer-kaomoji" key={idx} style={{ animation: "slideInUp 0.5s ease" }}>{kaomojis[idx]}</div>
        </footer>
      );
    }

    // ===== Back to Top =====
    function BackToTop({ visible }) {
      return (
        <button className={`back-to-top ${visible ? "visible" : ""}`} onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
          ↑
        </button>
      );
    }

    // ===== App =====
    function App() {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem("stukdee_theme");
        if (saved) return saved;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      });
      const [mobileOpen, setMobileOpen] = useState(false);
      const [showBackTop, setShowBackTop] = useState(false);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("stukdee_theme", theme);
      }, [theme]);

      const toggleTheme = () => setTheme(t => t === "light" ? "dark" : "light");

      useEffect(() => {
        const handler = () => setShowBackTop(window.scrollY > 400);
        window.addEventListener("scroll", handler);
        return () => window.removeEventListener("scroll", handler);
      }, []);

      useEffect(() => {
        const observer = new IntersectionObserver(
          entries => entries.forEach(e => e.target.classList.toggle("visible", e.isIntersecting)),
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
        );
        document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);

      const isDark = theme === 'dark';

      return (
        <ModalProvider>
          <FloatingDecor />
          <ShootingStars isDark={isDark} />
          <Navbar theme={theme} toggleTheme={toggleTheme} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
          <Hero />
          <About />
          <Hobbies />
          <Social />
          <FunSection />
          <Footer />
          <BackToTop visible={showBackTop} />
        </ModalProvider>
      );
    }

    // ===== Render =====
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    function announceUpgrade() {
      window.parent.postMessage({ type: "miaoda:upgrade:available", kind: "interactive-prototype" }, "*");
    }
    announceUpgrade();
    if (document.readyState !== "complete") {
      window.addEventListener("load", announceUpgrade, { once: true });
    }
  </script>
